<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1c1e" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <linearGradient id="appleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a84ff" />
      <stop offset="50%" stop-color="#5e5ce6" />
      <stop offset="100%" stop-color="#bf5af2" />
    </linearGradient>
    <linearGradient id="swiftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9f0a" />
      <stop offset="100%" stop-color="#ff375f" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- iOS Continuous Corner Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="116" fill="url(#bgGrad)" stroke="#0a84ff" stroke-width="5" stroke-opacity="0.6" />
  
  <!-- Outer Tech Ring -->
  <circle cx="256" cy="245" r="165" fill="none" stroke="url(#appleGrad)" stroke-width="10" stroke-dasharray="14 10" filter="url(#glow)" opacity="0.75" />

  <!-- Code Web Brackets < and > -->
  <path d="M 155 185 L 95 245 L 155 305" fill="none" stroke="#0a84ff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 357 185 L 417 245 L 357 305" fill="none" stroke="#bf5af2" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Apple Silhouette Center -->
  <g transform="translate(256, 235) scale(8.5) translate(-12, -13)">
    <!-- Leaf -->
    <path d="M15.97 4.17c.61-.75 1.04-1.8 0.92-2.86-.9.04-2 .6-2.65 1.35-.56.64-1.06 1.7-0.93 2.73 1.01.08 2.05-.51 2.66-1.22z" fill="#30d158" filter="url(#glow)" />
    <!-- Apple Body -->
    <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83z" fill="url(#appleGrad)" filter="url(#glow)" />
  </g>

  <!-- iOS IPA Badge Container -->
  <rect x="180" y="375" width="152" height="60" rx="16" fill="#1c1c1e" stroke="#0a84ff" stroke-width="3.5" />
  <text x="256" y="415" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="24" font-weight="800" fill="#0a84ff" text-anchor="middle" letter-spacing="2">IPA</text>
</svg>
