name: Build Signed iOS IPA

on:
  # push:
    # branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Build Xcode Archive
        run: |
          PROJ_NAME=$(find . -maxdepth 2 -name "*.xcodeproj" | head -n 1)
          if [ -z "$PROJ_NAME" ]; then
            echo "No .xcodeproj found in repository"
            exit 1
          fi
          SCHEME_NAME=$(xcodebuild -list -project "$PROJ_NAME" | grep -A 1 "Schemes:" | tail -n 1 | tr -d ' ')
          echo "Building Scheme: $SCHEME_NAME"
          xcodebuild archive \
            -project "$PROJ_NAME" \
            -scheme "$SCHEME_NAME" \
            -archivePath build/App.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO

      - name: Export Payload to IPA
        run: |
          mkdir -p build/Payload
          cp -r build/App.xcarchive/Products/Applications/*.app build/Payload/
          cd build && zip -r App.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iOS-App-IPA
          path: build/App.ipa
