name: Package Web App into iOS IPA & Safari Profile

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Web URL to Package into iOS App'
        required: false
        default: 'https://example.com'
      app_name:
        description: 'Application Name'
        required: false
        default: 'ExampleApp'
      bundle_id:
        description: 'iOS Bundle Identifier'
        required: false
        default: 'com.web2ipa.example'
      orientation:
        description: 'Screen Orientation'
        required: false
        default: 'sensor'
        type: choice
        options:
          - sensor
          - portrait
          - landscape
      publish_release:
        description: 'Publish iOS deliverables directly to GitHub Releases'
        required: false
        default: true
        type: boolean
  repository_dispatch:
    types: [package_ios]

permissions:
  contents: write

jobs:
  package-ios:
    name: Package iOS Deliverables
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Web2IPA Packaging
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p ~/Web2IPA_Output
          URL="${{ github.event.inputs.url || github.event.client_payload.url || 'https://example.com' }}"
          APP_NAME="${{ github.event.inputs.app_name || github.event.client_payload.app_name || 'ExampleApp' }}"
          BUNDLE_ID="${{ github.event.inputs.bundle_id || github.event.client_payload.bundle_id || 'com.web2ipa.example' }}"
          ORIENTATION="${{ github.event.inputs.orientation || github.event.client_payload.orientation || 'sensor' }}"
          python agent.py \
            --url "$URL" \
            --name "$APP_NAME" \
            --bundle-id "$BUNDLE_ID" \
            --orientation "$ORIENTATION" \
            --no-serve

      - name: Upload iOS App Deliverables
        uses: actions/upload-artifact@v4
        with:
          name: web2ipa-deliverables-${{ github.run_number }}
          path: /home/runner/Web2IPA_Output/
          retention-days: 30

      - name: Publish to GitHub Releases
        if: ${{ github.event.inputs.publish_release != false }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ github.run_number }}-ios"
          name: "Web2IPA Build #${{ github.run_number }} (${{ github.event.inputs.app_name || 'iOS App' }})"
          body: |
            ### 🍎 Web2IPA Cloud Deliverables Build #${{ github.run_number }}
            - **App Name**: `${{ github.event.inputs.app_name || 'iOS App' }}`
            - **Target URL**: `${{ github.event.inputs.url || 'https://example.com' }}`
            - **Bundle ID**: `${{ github.event.inputs.bundle_id || 'com.web2ipa.app' }}`
            
            Download the signed iOS Safari Profile (`.mobileconfig`), standalone sideload `.ipa`, or native Swift Xcode source `.zip` directly from Assets below.
          files: /home/runner/Web2IPA_Output/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
